name: Foundation CI

on:
  push:
    branches: [phase-1-foundation]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and generate lockfile
        run: npm install --no-audit --no-fund
      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_example
        run: npm run build
